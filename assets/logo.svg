<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="scToothGrad" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00647f"/>
      <stop offset="50%" stop-color="#0083a0"/>
      <stop offset="100%" stop-color="#34b3c7"/>
    </linearGradient>
    <linearGradient id="scSmileGrad" x1="18" y1="20" x2="46" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#def0ff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="scBgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#def0ff"/>
      <stop offset="100%" stop-color="#c5e7ff"/>
    </linearGradient>
    <filter id="scShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00647f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded pill (Optional container) -->
  <rect width="64" height="64" rx="18" fill="url(#scBgGrad)"/>

  <!-- Main Tooth Anatomy Silhouette -->
  <path d="M32 10.5C25.5 6.5 15.5 6.5 13.5 16C11.5 25.5 14.5 36.5 18.5 46.5C20.5 51.5 22.5 55 24.5 55C26.5 55 27.5 50 28.5 44C29.5 38 34.5 38 35.5 44C36.5 50 37.5 55 39.5 55C41.5 55 43.5 51.5 45.5 46.5C49.5 36.5 52.5 25.5 50.5 16C48.5 6.5 38.5 6.5 32 10.5Z" 
        fill="url(#scToothGrad)" 
        filter="url(#scShadow)"/>

  <!-- Stylized Enamel Smile Arch -->
  <path d="M20 22C25 29 39 29 44 22C40 26.5 34 28 28 26.5C24.5 25.5 21.8 23.5 20 22Z" 
        fill="url(#scSmileGrad)"/>

  <!-- Gloss Specular Highlight -->
  <path d="M18 16C17 21 18 27 19.5 31C18.8 26 18.2 21 19.5 17C20.2 14.5 22 13 24 12C21 12.5 19 13.8 18 16Z" 
        fill="#ffffff" 
        opacity="0.5"/>

  <!-- Dental Sparkle Star -->
  <path d="M47 9L48.2 12.8L52 14L48.2 15.2L47 19L45.8 15.2L42 14L45.8 12.8L47 9Z" 
        fill="#ffea79" 
        filter="drop-shadow(0 0 3px rgba(255, 234, 121, 0.8))"/>
</svg>
